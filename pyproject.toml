[project]
name = "aipet"
version = "0.1.0"
description = "Pet store AI follow-up assistant for repurchase reminders and sample conversion."
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10.4",
    "click>=8.1.7",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "openai>=1.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "rich>=13.7.0",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.29.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
