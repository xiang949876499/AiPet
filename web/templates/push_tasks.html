<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>推送任务 - {{ app_name }}</title>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 32px; color: #1f2937; }
    h1 { font-size: 28px; margin-bottom: 16px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #e5e7eb; text-align: left; padding: 10px; vertical-align: top; }
    .status { font-weight: 700; }
    .error { color: #b91c1c; }
  </style>
</head>
<body>
  <h1>推送任务</h1>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>推送渠道</th>
        <th>接收人</th>
        <th>场景</th>
        <th>内容</th>
        <th>状态</th>
        <th>错误信息</th>
      </tr>
    </thead>
    <tbody>
      {% for task in tasks %}
      <tr>
        <td>{{ task.id }}</td>
        <td>{{ task.channel }}</td>
        <td>{{ task.receiver_id }}</td>
        <td>{{ task.scene }}</td>
        <td>{{ task.content }}</td>
        <td class="status">{{ status_labels.get(task.status, task.status) }}</td>
        <td class="error">{{ task.error_message or "" }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
