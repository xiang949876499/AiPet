<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>复购运营 - {{ app_name }}</title>
  <style>
    body { margin: 0; background: #fbfcf8; color: #17211d; font-family: "Microsoft YaHei", "Segoe UI", sans-serif; }
    header, main { max-width: 1180px; margin: 0 auto; padding: 24px; }
    header { border-bottom: 1px solid #dce5df; }
    a { color: #1f7a4d; text-decoration: none; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #dce5df; border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px 14px; border-bottom: 1px solid #dce5df; text-align: left; vertical-align: top; }
    th { color: #5f6d66; font-size: 13px; }
    tr:last-child td { border-bottom: 0; }
    .message { max-width: 360px; }
    .priority { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #9c5b34; color: #fff; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <a href="/">返回工作台</a>
    <h1>复购运营</h1>
    <p>查看待跟进任务、生成原因、建议动作和可复制话术。</p>
  </header>
  <main>
    <table>
      <thead>
        <tr><th>客户</th><th>宠物</th><th>类型</th><th>优先级</th><th>原因</th><th>建议动作</th><th>话术</th><th>状态</th></tr>
      </thead>
      <tbody>
        {% for task in tasks %}
        <tr>
          <td>{{ task.customer_name }}</td>
          <td>{{ task.pet_name }}</td>
          <td>{{ task.task_type }}</td>
          <td><span class="priority">{{ task.priority }}</span></td>
          <td>{{ task.reason }}</td>
          <td>{{ task.suggested_action }}</td>
          <td class="message">{{ task.ai_message or "" }}</td>
          <td>{{ task.status }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </main>
</body>
</html>
