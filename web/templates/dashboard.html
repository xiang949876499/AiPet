<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>{{ app_name }}</title>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 32px; color: #1f2937; }
    h1 { font-size: 28px; margin-bottom: 16px; }
    .metrics { display: flex; gap: 16px; margin-bottom: 24px; }
    .metric { border: 1px solid #d1d5db; border-radius: 8px; padding: 14px 18px; min-width: 140px; }
    .number { font-size: 28px; font-weight: 700; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #e5e7eb; text-align: left; padding: 10px; vertical-align: top; }
  </style>
</head>
<body>
  <h1>今日工作台</h1>
  <div class="metrics">
    <div class="metric"><div>客户数</div><div class="number">{{ metrics.customers }}</div></div>
    <div class="metric"><div>待跟进</div><div class="number">{{ metrics.pending_tasks }}</div></div>
  </div>
  <table>
    <thead>
      <tr><th>客户</th><th>宠物</th><th>原因</th><th>话术</th></tr>
    </thead>
    <tbody>
      {% for task in tasks %}
      <tr>
        <td>{{ task.customer.name }}</td>
        <td>{{ task.pet.name }}</td>
        <td>{{ task.reason }}</td>
        <td>{{ task.ai_message }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
